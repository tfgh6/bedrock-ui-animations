modLoader = "javafml"
loaderVersion = "[1,)"
license = "Unlicense"
iconFile = "assets/ui_transitions/icon.png"

[[mods]]
modId = "ui_transitions"
version = "1.5.0"
displayName = "Bedrock UI Animations"
logoFile = "assets/ui_transitions/icon.png"
# 元数据没法跟着游戏语言切换，所以这里写成中英双语，两个加载器保持一致
description = '''
Bedrock-style slide + fade transitions for container and menu UIs, with per-layer toggles. Client-side only.
为容器 / 菜单界面添加基岩版风格的滑入滑出与淡入淡出过渡动画，含逐层开关。纯客户端。
'''
authors = "KurumiのZaphkiel, JiaWang-sama"

[[mixins]]
config = "ui-transitions.mixins.json"

[[dependencies.ui_transitions]]
modId = "neoforge"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "cloth_config"
# required：本模组的配置界面完全由 Cloth Config 提供，缺了就没法用。
# 标成 required 之后，即使入口构造函数没跑到，NeoForge 自己也会给出缺依赖的界面。
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "sodium"
type = "optional"
versionRange = "[0.6,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "jei"
type = "optional"
versionRange = "[1,)"
ordering = "NONE"
side = "CLIENT"
