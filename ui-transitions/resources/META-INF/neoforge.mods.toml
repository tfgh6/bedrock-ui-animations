modLoader = "javafml"
loaderVersion = "[1,)"
license = "Unlicense"
iconFile = "assets/ui_transitions/icon.png"

[[mods]]
modId = "ui_transitions"
version = "1.4.3"
displayName = "Bedrock UI Animations"
logoFile = "assets/ui_transitions/icon.png"
description = '''
为容器 / 菜单界面添加滑入滑出与淡入淡出过渡动画（基岩版风格）。纯客户端。
同一 jar 同时支持 Fabric 与 NeoForge；NeoForge 侧只依赖下面声明的 Mixin 配置。
'''
authors = "KurumiのZaphkiel, JiaWang-sama"

[[mixins]]
config = "ui-transitions.mixins.json"

[[dependencies.ui_transitions]]
modId = "neoforge"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "cloth_config"
# required：本模组的配置界面完全由 Cloth Config 提供，缺了就没法用。
# 标成 required 之后，即使入口构造函数没跑到，NeoForge 自己也会给出缺依赖的界面。
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "sodium"
type = "optional"
versionRange = "[0.6,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ui_transitions]]
modId = "jei"
type = "optional"
versionRange = "[1,)"
ordering = "NONE"
side = "CLIENT"
