plugins {
    // MC 26.1+ 不再混淆，Loom 不需要 mappings 依赖
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom 会自动带上 Fabric / Mojang 的仓库；这里只放额外依赖的仓库
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // 本模组不需要 Fabric API：只用 loader + Mixin（Mixin 由 loader 自带）
}

// 工具链用 JDK 25（MC 26.3 的类是 class file v69，只有 JDK 25 能读），
// 但**编译目标必须是 21**：ui-transitions.mixins.json 声明 compatibilityLevel = JAVA_21，
// 而且已实机验证过的产物是 v65。这里若放成 25（v69）就会产出与验证过的不等价的字节码。
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 让 runClient 直接带上可视化测试开关（只有设置 -PvisualTest 时才生效）
tasks.named('runClient') {
    if (project.hasProperty('visualTest')) {
        jvmArgs "-Duitransitions.visualTest=true",
                "-Duitransitions.visualTest.dir=${project.layout.buildDirectory.get().asFile}/visual-out"
    }
}
