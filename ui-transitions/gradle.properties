# Gradle 自身
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 显式指定 JDK 25（MC 26.3 的类是 class file v69，需要 JDK 25 工具链来读取）
# 注意：工具链是 25，但编译目标保持在 21（见 build.gradle 的 options.release）
org.gradle.java.home=C:\\Program Files\\Java\\zulu25.30.17-ca-jdk25.0.1-win_x64

# Fabric / Minecraft
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# 模组属性
# 版本号必须与 resources/fabric.mod.json、resources/META-INF/neoforge.mods.toml 一致
# （build_jar.py 会校验后两者；改版本时三处一起改）
mod_version=1.3.13
maven_group=com.uitransitions
# 与 build_jar.py 的产物名保持一致，避免同一个 jar 出现两种文件名
archives_base_name=Bedrock-UI-Animations
